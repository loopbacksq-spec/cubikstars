<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>БРАВЛ КРАСТЕР: ONLINE MULTIPLAYER</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial Black', Impact, sans-serif;
        }

        @media screen and (orientation: portrait) {
            body {
                transform: rotate(-90deg);
                transform-origin: left top;
                width: 100vh;
                height: 100vw;
                position: absolute;
                top: 100%;
                left: 0;
            }
        }

        /* МЕНЮ */
        #menu-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f001e 0%, #2b0045 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        #menu-bg-3d {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        #menu-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            width: 100%;
        }

        .profile-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .profile-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ffde00;
            border-radius: 15px;
            padding: 5px 15px;
            color: white;
            box-shadow: 0 4px 0 #b38f00;
        }

        .trophies {
            display: flex;
            align-items: center;
            background: #ff7f00;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 2px 8px;
            margin-left: 10px;
            font-size: 14px;
        }

        .trophy-icon {
            width: 18px;
            height: 18px;
            background: gold;
            clip-path: polygon(20% 0%, 80% 0%, 100% 40%, 50% 100%, 0% 40%);
            margin-right: 5px;
        }

        .stats-box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00e5ff;
            border-radius: 10px;
            padding: 5px 10px;
            color: #fff;
            font-size: 12px;
        }

        .nickname-box {
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ff007f;
            border-radius: 12px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nickname-input {
            background: #222;
            border: 2px solid #ff007f;
            border-radius: 8px;
            color: #fff;
            padding: 5px 10px;
            font-family: 'Arial Black', sans-serif;
            font-size: 16px;
            outline: none;
            width: 150px;
            text-align: center;
        }

        .character-title {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-shadow: 3px 3px 0px #000;
            font-size: 24px;
            text-align: center;
            width: 80%;
        }

        .btn-play {
            width: 220px;
            height: 70px;
            background: linear-gradient(180deg, #00ff2b 0%, #009914 100%);
            border: 4px solid #fff;
            border-radius: 20px;
            box-shadow: 0 8px 0 #005e0c, 0 10px 15px rgba(0,0,0,0.5);
            color: white;
            font-size: 28px;
            cursor: pointer;
            text-shadow: 2px 2px 0px #000;
            transition: transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 20px;
            right: 20px;
            pointer-events: auto;
        }

        .btn-play:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #005e0c;
        }

        /* ЭКРАН СИНХРОННОГО ПОИСКА */
        #matchmaking-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(10, 0, 25, 0.96);
            z-index: 150;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .mm-title {
            font-size: 36px;
            color: #ffde00;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        .mm-counter {
            font-size: 64px;
            color: #00ff2b;
            text-shadow: 4px 4px 0 #000;
            margin-bottom: 30px;
        }

        .btn-cancel {
            padding: 15px 40px;
            background: #ff3333;
            border: 3px solid #fff;
            border-radius: 15px;
            font-size: 22px;
            color: white;
            cursor: pointer;
            font-family: 'Arial Black', sans-serif;
            box-shadow: 0 6px 0 #990000;
        }

        /* ИГРОВОЙ ЭКРАН */
        #game-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 10;
        }

        .joystick-container {
            position: absolute;
            bottom: 40px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            touch-action: none;
            z-index: 20;
        }

        #joy-move { left: 50px; }
        #joy-shoot { right: 50px; }

        .joystick-knob {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            position: absolute;
        }

        #aim-line {
            position: absolute;
            width: 4px;
            height: 120px;
            background: linear-gradient(180deg, rgba(255,234,0,1) 0%, rgba(255,234,0,0) 100%);
            transform-origin: top center;
            display: none;
            z-index: 19;
            pointer-events: none;
        }

        #game-hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #danger-warning {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            color: #ff3333;
            font-size: 32px;
            text-shadow: 3px 3px 0 #000;
            display: none;
            z-index: 15;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .overhead-hud {
            position: absolute;
            z-index: 12;
            transform: translate(-50%, -100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 1.5px 1.5px 0 #000;
        }

        .overhead-name {
            color: #fff;
            font-size: 11px;
            margin-bottom: 2px;
            background: rgba(0,0,0,0.6);
            padding: 1px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .overhead-hp-bar {
            width: 55px;
            height: 8px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #fff;
            border-radius: 3px;
            overflow: hidden;
        }

        .overhead-hp-fill {
            width: 100%;
            height: 100%;
            background: #00ff2b;
        }

        /* ЭКРАН ИТОГОВ */
        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 1, 40, 0.98);
            z-index: 100;
            display: none;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            color: white;
            padding: 50px;
        }

        .go-left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .go-title {
            font-size: 48px;
            color: #ffde00;
            text-shadow: 4px 4px 0 #000;
        }

        .go-stats {
            font-size: 24px;
            text-align: center;
            line-height: 1.6;
        }

        .btn-retry {
            padding: 15px 40px;
            background: #ff7f00;
            border: 3px solid #fff;
            border-radius: 15px;
            font-size: 24px;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #b35300;
        }

        #end-game-char-view {
            width: 320px;
            height: 420px;
            background: rgba(0,0,0,0.4);
            border: 4px dashed #ffde00;
            border-radius: 20px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu-screen">
        <div id="menu-bg-3d"></div>
        <div id="menu-ui">
            <div class="top-bar">
                <div class="profile-container">
                    <div class="profile-box">
                        <span id="menu-player-name">КРАСТЕР</span>
                        <div class="trophies">
                            <div class="trophy-icon"></div>
                            <span id="menu-trophies-count">0</span>
                        </div>
                    </div>
                    <div class="stats-box">
                        Побед: <span id="stat-wins" style="color:#00ff2b">0</span> | 
                        Сливов: <span id="stat-losses" style="color:#ff3333">0</span>
                    </div>
                </div>

                <div class="nickname-box">
                    <span style="color: #ff007f; font-size: 12px;">НИКНЕЙМ:</span>
                    <input type="text" id="nickname-input" class="nickname-input" value="КРАСТЕР" maxlength="10">
                </div>
            </div>

            <div class="character-title">
                <h2 id="menu-ready-text">КРАСТЕР ГОТОВ К БОЮ</h2>
            </div>

            <div class="bottom-bar">
                <button class="btn-play" id="btn-start">В БОЙ!</button>
            </div>
        </div>
    </div>

    <div id="matchmaking-screen">
        <div class="mm-title">ОЖИДАНИЕ ИГРОКОВ...</div>
        <div class="mm-counter" id="mm-counter">1 / 15</div>
        <button class="btn-cancel" id="btn-cancel-mm">ОТМЕНА</button>
    </div>

    <div id="game-screen">
        <div id="game-hud">
            <div>Осталось бойцов: <span id="hud-alive" style="color: #ffde00;">15</span></div>
            <div>Твой HP: <span id="hud-hp" style="color: #00ff2b;">400</span></div>
        </div>

        <div id="danger-warning">💥 ОПАСНОСТЬ! ТОКСИЧНЫЙ ТУМАН! 💥</div>
        <div id="overhead-hud-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 12;"></div>

        <div class="joystick-container" id="joy-move">
            <div class="joystick-knob" id="knob-move"></div>
        </div>
        <div class="joystick-container" id="joy-shoot">
            <div class="joystick-knob" id="knob-shoot"></div>
        </div>

        <div id="aim-line"></div>
    </div>

    <div id="game-over-screen">
        <div class="go-left-panel">
            <div class="go-title" id="go-result-title">ПОБЕДА!</div>
            <div class="go-stats">
                <div>Ваше место: <span id="go-rank" style="color: #ffde00;">#1</span></div>
                <div>Кубки: <span id="go-trophies" style="color: #00ff2b;">+10</span></div>
            </div>
            <button class="btn-retry" id="btn-back-to-menu">В МЕНЮ</button>
        </div>
        <div id="end-game-char-view"></div>
    </div>

    <script>
        // --- ПОДКЛЮЧЕНИЕ К СЕРВЕРУ ОНЛАЙНА ---
        // Когда задеплоишь на Render, замени 'ws://localhost:8080' на свой 'wss://имя-приложения.onrender.com'
        const SERVER_URL = 'ws://localhost:8080'; 
        let socket = null;

        function connectToServer() {
            socket = new WebSocket(SERVER_URL);

            socket.onopen = () => {
                console.log("Успешное подключение к серверу!");
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'lobby_update') {
                    // Синхронизированный счетчик лобби для ВСЕХ игроков!
                    document.getElementById('mm-counter').textContent = `${data.count} / 15`;
                    playSynthSound(300 + data.count * 20, "sine", 0.08, 0.1);
                    
                    // Если лобби заполнено (например, 15 или автостарт с ботами)
                    if (data.count >= 15) {
                        // Сервер сам пришлет команду 'game_start'
                    }
                }

                if (data.type === 'game_start') {
                    matchmakingScreen.style.display = 'none';
                    startBattle(data);
                }

                if (data.type === 'opponent_update') {
                    const opp = entities.find(e => e.id === data.id);
                    if (opp) {
                        opp.mesh.position.set(data.x, opp.mesh.position.y, data.z);
                        opp.mesh.rotation.y = data.rotY;
                        opp.hp = data.hp;
                        opp.powerups = data.powerups;
                        opp.isDead = data.isDead;
                        if (data.isDead) killEntity(opp);
                    }
                }

                if (data.type === 'opponent_shoot') {
                    const opp = entities.find(e => e.id === data.id);
                    if (opp) {
                        shootBullet(opp, data.dirX, data.dirZ, false);
                    }
                }
            };

            socket.onclose = () => {
                console.log("Соединение прервано, переподключение...");
                setTimeout(connectToServer, 2000);
            };
        }

        // Запуск подключения при старте
        connectToServer();

        // --- ЛОКАЛЬНАЯ БАЗА ДАННЫХ ---
        let trophies = parseInt(localStorage.getItem('bs_trophies')) || 0;
        let totalWins = parseInt(localStorage.getItem('bs_wins')) || 0;
        let totalLosses = parseInt(localStorage.getItem('bs_losses')) || 0;
        let playerName = localStorage.getItem('bs_player_name') || "КРАСТЕР";

        function saveGameData() {
            localStorage.setItem('bs_trophies', trophies);
            localStorage.setItem('bs_wins', totalWins);
            localStorage.setItem('bs_losses', totalLosses);
            localStorage.setItem('bs_player_name', playerName);
        }

        // --- ЗВУКИ ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicInterval;

        function playSynthSound(freq, type, duration, volume, pan = 0) {
            try {
                if (audioCtx.state === 'suspended') return;
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                if (panner) {
                    panner.pan.setValueAtTime(pan, audioCtx.currentTime);
                    osc.connect(panner);
                    panner.connect(gainNode);
                } else {
                    osc.connect(gainNode);
                }
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playDistanceSound(targetX, targetZ, type = "shoot") {
            if (!player || player.isDead) return;
            const dx = targetX - player.mesh.position.x;
            const dz = targetZ - player.mesh.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist > 50) return;
            const maxDist = 50;
            const vol = Math.max(0, 1 - (dist / maxDist)) * 0.35;
            const pan = Math.max(-1, Math.min(1, dx / 25));

            if (type === "shoot") {
                playSynthSound(140 + Math.random() * 40, "sawtooth", 0.15, vol, pan);
            } else if (type === "hit") {
                playSynthSound(350, "triangle", 0.08, vol * 1.2, pan);
            } else if (type === "powerup") {
                playSynthSound(587, "sine", 0.3, vol * 1.5, pan);
            } else if (type === "box_break") {
                playSynthSound(100, "triangle", 0.25, vol * 1.4, pan);
            }
        }

        function startMusic() {
            if (musicInterval) clearInterval(musicInterval);
            let beat = 0;
            musicInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') return;
                const notes = [110, 110, 130, 110, 146, 110, 165, 130];
                playSynthSound(notes[beat % notes.length], "sine", 0.25, 0.07, 0);
                beat++;
            }, 300);
        }

        function stopMusic() { clearInterval(musicInterval); }

        // --- СОСТОЯНИЕ ---
        let isMobile = 'ontouchstart' in window;
        let gameActive = false;

        const menuScreen = document.getElementById('menu-screen');
        const matchmakingScreen = document.getElementById('matchmaking-screen');
        const gameScreen = document.getElementById('game-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const btnStart = document.getElementById('btn-start');
        const btnCancelMm = document.getElementById('btn-cancel-mm');
        const btnBackToMenu = document.getElementById('btn-back-to-menu');
        const hudAlive = document.getElementById('hud-alive');
        const hudHp = document.getElementById('hud-hp');
        const dangerWarning = document.getElementById('danger-warning');
        const menuTrophiesCount = document.getElementById('menu-trophies-count');
        const nicknameInput = document.getElementById('nickname-input');
        const menuPlayerName = document.getElementById('menu-player-name');
        const overheadHudContainer = document.getElementById('overhead-hud-container');
        const menuReadyText = document.getElementById('menu-ready-text');

        menuTrophiesCount.textContent = trophies;
        menuPlayerName.textContent = playerName;
        nicknameInput.value = playerName;
        menuReadyText.textContent = `${playerName} ГОТОВ К БОЮ`;
        document.getElementById('stat-wins').textContent = totalWins;
        document.getElementById('stat-losses').textContent = totalLosses;

        if (isMobile) {
            document.getElementById('joy-move').style.display = 'flex';
            document.getElementById('joy-shoot').style.display = 'flex';
        }

        nicknameInput.addEventListener('input', () => {
            playerName = nicknameInput.value.trim().toUpperCase() || "КРАСТЕР";
            menuPlayerName.textContent = playerName;
            menuReadyText.textContent = `${playerName} ГОТОВ К БОЮ`;
            saveGameData();
        });

        document.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
                startMusic();
            }
        }, { once: true });

        // --- 3D СЦЕНЫ (THREE.JS) ---
        let scene, camera, renderer;
        let menuScene, menuCamera, menuRenderer, menuCharacter;
        let endScene, endCamera, endRenderer, endCharacter, isVictoryEnd = false;
        let clock = new THREE.Clock();

        const MAP_SIZE = 140; 
        const MAX_HP = 400;   
        const BASE_DAMAGE = 35; 
        const DEFAULT_SPEED = 6.5;

        let player;
        let entities = []; 
        let bullets = [];
        let particles = [];
        let obstacles = [];
        let boxes = [];     
        let powerups = [];  

        let poisonZone = { radius: MAP_SIZE / 2, x: 0, z: 0 };
        const poisonShrinkSpeed = 0.55;
        let poisonVisualMesh;

        let keys = { w: false, a: false, s: false, d: false };
        let mouse = { x: 0, y: 0, clicked: false };
        
        let joystickMove = { x: 0, y: 0 };
        let joystickShoot = { x: 0, y: 0, active: false };

        initMenu3D();
        animateMenu();

        function initMenu3D() {
            const container = document.getElementById('menu-bg-3d');
            menuScene = new THREE.Scene();
            menuCamera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            menuCamera.position.set(0, 1.5, 4);
            menuCamera.lookAt(0, 0.8, 0);

            menuRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            menuRenderer.setSize(container.clientWidth, container.clientHeight);
            menuRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(menuRenderer.domElement);

            const light = new THREE.AmbientLight(0xffffff, 0.85);
            menuScene.add(light);
            const dirLight = new THREE.DirectionalLight(0xffaa00, 1.5);
            dirLight.position.set(5, 10, 5);
            menuScene.add(dirLight);

            menuCharacter = createCharacterModel(0x3a86ff);
            menuScene.add(menuCharacter);

            window.addEventListener('resize', () => {
                if (!gameActive && menuRenderer) {
                    menuCamera.aspect = container.clientWidth / container.clientHeight;
                    menuCamera.updateProjectionMatrix();
                    menuRenderer.setSize(container.clientWidth, container.clientHeight);
                }
            });
        }

        function animateMenu() {
            requestAnimationFrame(animateMenu);
            if (!gameActive && menuCharacter) {
                const time = clock.getElapsedTime();
                menuCharacter.rotation.y = Math.sin(time * 0.5) * 0.3;
                menuCharacter.position.y = Math.sin(time * 2) * 0.05;
                
                const leftArm = menuCharacter.getObjectByName("leftArm");
                const rightArm = menuCharacter.getObjectByName("rightArm");
                if (leftArm && rightArm) {
                    leftArm.rotation.x = Math.sin(time * 2) * 0.2;
                    rightArm.rotation.x = -Math.sin(time * 2) * 0.2;
                }
                menuRenderer.render(menuScene, menuCamera);
            }
        }

        function createCharacterModel(colorHex) {
            const group = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(0.6, 0.8, 0.4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            group.add(body);

            const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.25;
            group.add(head);

            const hairGeo = new THREE.BoxGeometry(0.54, 0.2, 0.54);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 1.45;
            group.add(hair);

            const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.15, 1.25, 0.26);
            const rightEye = leftEye.clone();
            rightEye.position.x = 0.15;
            group.add(leftEye, rightEye);

            const armGeo = new THREE.BoxGeometry(0.2, 0.6, 0.2);
            const armMat = new THREE.MeshStandardMaterial({ color: colorHex });

        // --- СТАРТ БИТВЫ (С ДАННЫМИ ОТ СЕРВЕРА) ---
        function startBattle(gameData) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

        function initGame3D(gameData) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0e021a);
            scene.fog = new THREE.FogExp2(0x0e021a, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            gameScreen.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff0dd, 0.8);
            sunLight.position.set(30, 60, 20);
            scene.add(sunLight);

            createBattleMap();
            spawnBoxes(12);

            // Идеальное распределение по кругу на старте (все 15 игроков)
            const radius = 45; 
            const playerIndex = gameData.playerIndex;

            // Игрок
            const pAngle = (playerIndex / 15) * Math.PI * 2;
            const pX = Math.cos(pAngle) * radius;
            const pZ = Math.sin(pAngle) * radius;

            player = {
                id: 'player',
                name: playerName,
                mesh: createCharacterModel(0x00ff2b),
                x: pX,
                z: pZ,
                speed: DEFAULT_SPEED,
                hp: MAX_HP,
                maxHp: MAX_HP,
                powerups: 0,
                cooldown: 0,
                isDead: false,
                isBot: false,
                radius: 0.6,
                lastHurtTime: 0, 
                lastAttackTime: 0, 
                overheadElement: createOverheadHUD(playerName, false)
            };
            player.mesh.position.set(pX, 0, pZ);
            scene.add(player.mesh);
            entities.push(player);

            // Создаем оппонентов (реальные игроки + боты до 15)
            const botColors = [
                0xff3333, 0xff00ff, 0x00ffff, 0xffa500, 0xffff00, 
                0x8a2be2, 0xff69b4, 0x00ffcc, 0x9932cc, 0xff4500,
                0x32cd32, 0x4169e1, 0xdb7093, 0xffd700
            ];

            let colorIdx = 0;
            for (let i = 0; i < 15; i++) {
                if (i === playerIndex) continue; // Наше место занято

                const angle = (i / 15) * Math.PI * 2;
                const bX = Math.cos(angle) * radius;
                const bZ = Math.sin(angle) * radius;

                // Проверяем, есть ли на этом месте реальный игрок от сервера
                const realOpponent = gameData.opponents[i] || null;
                const isBot = !realOpponent;
                const id = isBot ? `bot_${i}` : realOpponent.id;
                const name = isBot ? `БОТ_${i}` : realOpponent.username;

                const mesh = createCharacterModel(isBot ? botColors[colorIdx % botColors.length] : 0x00e5ff);
                colorIdx++;

                mesh.position.set(bX, 0, bZ);
                scene.add(mesh);

                entities.push({
                    id: id,
                    name: name,
                    mesh: mesh,
                    x: bX,
                    z: bZ,
                    speed: DEFAULT_SPEED,
                    hp: MAX_HP,
                    maxHp: MAX_HP,
                    powerups: 0,
                    cooldown: 0,
                    isDead: false,
                    isBot: isBot,
                    radius: 0.6,
                    targetX: bX,
                    targetZ: bZ,
                    aiTimer: 0,
                    lastHurtTime: 0,
                    lastAttackTime: 0,
                    overheadElement: createOverheadHUD(name, isBot)
                });
            }

            // Настройка токсичного тумана
            poisonZone = { radius: MAP_SIZE / 2, x: 0, z: 0 };
            const poisonGeo = new THREE.CylinderGeometry(MAP_SIZE / 2, MAP_SIZE / 2, 20, 64, 1, true);
            const poisonMat = new THREE.MeshBasicMaterial({
                color: 0x9400d3,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide
            });
            poisonVisualMesh = new THREE.Mesh(poisonGeo, poisonMat);
            poisonVisualMesh.position.y = 3;
            scene.add(poisonVisualMesh);

            setupControls();
            requestAnimationFrame(gameLoop);
        }

        function createOverheadHUD(name, isBot) {
            const div = document.createElement('div');
            div.className = 'overhead-hud';
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'overhead-name';
            nameDiv.textContent = `${name} [0]`;
            
            const bar = document.createElement('div');
            bar.className = 'overhead-hp-bar';
            
            const fill = document.createElement('div');
            fill.className = 'overhead-hp-fill';

            bar.appendChild(fill);
            div.appendChild(nameDiv);
            div.appendChild(bar);
            overheadHudContainer.appendChild(div);

            return { container: div, nameDiv: nameDiv, fill: fill };
        }

        function checkCollisionAndCorrect(ent, nextX, nextZ) {
            let correctedX = nextX;
            let correctedZ = nextZ;

            obstacles.forEach(obs => {
                const minX = obs.x - obs.w / 2;
                const maxX = obs.x + obs.w / 2;
                const minZ = obs.z - obs.d / 2;
                const maxZ = obs.z + obs.d / 2;

                const closestX = Math.max(minX, Math.min(correctedX, maxX));
                const closestZ = Math.max(minZ, Math.min(correctedZ, maxZ));

                const dx = correctedX - closestX;
                const dz = correctedZ - closestZ;
                const distance = Math.sqrt(dx * dx + dz * dz);

                // Идеальный обход препятствий по касательной
                if (distance < ent.radius) {
                    if (distance === 0) return;
                    const overlap = ent.radius - distance;
                    correctedX += (dx / distance) * overlap;
                    correctedZ += (dz / distance) * overlap;
                }
            });

            return { x: correctedX, z: correctedZ };
        }

        function updateOverheadHUDPositions() {
            const tempV = new THREE.Vector3();
            entities.forEach(ent => {
                if (ent.isDead) {
                    if (ent.overheadElement.container.parentNode) {
                        ent.overheadElement.container.parentNode.removeChild(ent.overheadElement.container);
                    }
                    return;
                }

                tempV.setFromMatrixPosition(ent.mesh.matrixWorld);
                tempV.y += 1.7;
                tempV.project(camera);

                if (Math.abs(tempV.x) > 1 || Math.abs(tempV.y) > 1 || tempV.z > 1) {
                    ent.overheadElement.container.style.display = 'none';
                    return;
                }

                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                ent.overheadElement.container.style.display = 'flex';
                ent.overheadElement.container.style.left = `${x}px`;
                ent.overheadElement.container.style.top = `${y}px`;

                const hpPercent = Math.max(0, (ent.hp / ent.maxHp) * 100);
                ent.overheadElement.fill.style.width = `${hpPercent}%`;
                ent.overheadElement.nameDiv.textContent = `${ent.name} [💪${ent.powerups}]`;

                if (hpPercent < 30) {
                    ent.overheadElement.fill.style.background = '#ff2222';
                } else {
                    ent.overheadElement.fill.style.background = ent.id === 'player' ? '#00ff2b' : '#ffaa00';
                }
            });
        }

        function createBattleMap() {
            const groundGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x486e25, roughness: 0.95 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x2c2d30 });
            
            // Границы арены
            const borderGeo = new THREE.BoxGeometry(2, 5, MAP_SIZE);
            const wallLeft = new THREE.Mesh(borderGeo, wallMat);
            wallLeft.position.set(-MAP_SIZE/2, 2.5, 0);
            scene.add(wallLeft);
            obstacles.push({ x: -MAP_SIZE/2, z: 0, w: 2, d: MAP_SIZE, type: 'wall' });

            const wallRight = new THREE.Mesh(borderGeo, wallMat);
            wallRight.position.set(MAP_SIZE/2, 2.5, 0);
            scene.add(wallRight);
            obstacles.push({ x: MAP_SIZE/2, z: 0, w: 2, d: MAP_SIZE, type: 'wall' });

            const borderGeoH = new THREE.BoxGeometry(MAP_SIZE, 5, 2);
            const wallTop = new THREE.Mesh(borderGeoH, wallMat);
            wallTop.position.set(0, 2.5, -MAP_SIZE/2);
            scene.add(wallTop);
            obstacles.push({ x: 0, z: -MAP_SIZE/2, w: MAP_SIZE, d: 2, type: 'wall' });

            const wallBottom = new THREE.Mesh(borderGeoH, wallMat);
            wallBottom.position.set(0, 2.5, MAP_SIZE/2);
            scene.add(wallBottom);
            obstacles.push({ x: 0, z: MAP_SIZE/2, w: MAP_SIZE, d: 2, type: 'wall' });

            // Перегородки
            const mapObstacles = [
                { x: -30, z: -30, w: 14, h: 3, d: 4 },
                { x: 30, z: 30, w: 14, h: 3, d: 4 },
                { x: 30, z: -30, w: 4, h: 3, d: 14 },
                { x: -30, z: 30, w: 4, h: 3, d: 14 },
                { x: 0, z: -35, w: 24, h: 3.5, d: 6 },
                { x: 0, z: 35, w: 24, h: 3.5, d: 6 },
                { x: -35, z: 0, w: 6, h: 3.5, d: 24 },
                { x: 35, z: 0, w: 6, h: 3.5, d: 24 }
            ];

            mapObstacles.forEach(obs => {
                const geo = new THREE.BoxGeometry(obs.w, obs.h, obs.d);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(obs.x, obs.h / 2, obs.z);
                scene.add(mesh);
                obstacles.push({ x: obs.x, z: obs.z, w: obs.w, d: obs.d, type: 'wall' });
            });
        }

        function spawnBoxes(count) {
            for (let i = 0; i < count; i++) {
                let attempts = 0;
                let bx = 0, bz = 0;
                let valid = false;

                while (!valid && attempts < 100) {
                    bx = (Math.random() - 0.5) * (MAP_SIZE - 40);
                    bz = (Math.random() - 0.5) * (MAP_SIZE - 40);
                    attempts++;

                    valid = true;
                    for (let j = 0; j < obstacles.length; j++) {
                        const obs = obstacles[j];
                        if (Math.abs(bx - obs.x) < (obs.w/2 + 2) && Math.abs(bz - obs.z) < (obs.d/2 + 2)) {
                            valid = false;
                            break;
                        }
                    }
                }

                if (valid) {
                    const boxMesh = createBoxMesh();
                    boxMesh.position.set(bx, 0, bz);
                    scene.add(boxMesh);

                    const boxId = 'box_' + i;
                    boxes.push({
                        id: boxId,
                        mesh: boxMesh,
                        x: bx,
                        z: bz,
                        w: 1.6,
                        d: 1.6,
                        hp: 130,
                        isDead: false
                    });
                    obstacles.push({ x: bx, z: bz, w: 1.6, d: 1.6, id: boxId, type: 'box' });
                }
            }
        }

        // --- УПРАВЛЕНИЕ ---
        function setupControls() {
            keys = { w: false, a: false, s: false, d: false };
            mouse = { x: 0, y: 0, clicked: false };

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || k === 'ц') keys.w = true;
                if (k === 's' || k === 'ы') keys.s = true;
                if (k === 'a' || k === 'ф') keys.a = true;
                if (k === 'd' || k === 'в') keys.d = true;
            });

            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || k === 'ц') keys.w = false;
                if (k === 's' || k === 'ы') keys.s = false;
                if (k === 'a' || k === 'ф') keys.a = false;
                if (k === 'd' || k === 'в') keys.d = false;
            });

            window.addEventListener('mousemove', (e) => {
                if (isMobile) return;
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            window.addEventListener('mousedown', () => { if (!isMobile) mouse.clicked = true; });
            window.addEventListener('mouseup', () => { if (!isMobile) mouse.clicked = false; });

            if (isMobile) {
                setupMobileJoystick('joy-move', 'knob-move', (x, y) => {
                    joystickMove.x = x;
                    joystickMove.y = y;
                }, false);

                setupMobileJoystick('joy-shoot', 'knob-shoot', (x, y, active) => {
                    joystickShoot.x = x;
                    joystickShoot.y = y;
                    joystickShoot.active = active;

                    const aimLine = document.getElementById('aim-line');
                    if (active && (Math.abs(x) > 0.15 || Math.abs(y) > 0.15)) {
                        aimLine.style.display = 'block';
                        const angle = Math.atan2(x, -y);
                        
                        const screenX = window.innerWidth / 2;
                        const screenY = window.innerHeight / 2 + 30; 
                        aimLine.style.left = `${screenX}px`;
                        aimLine.style.top = `${screenY}px`;
                        aimLine.style.transform = `rotate(${angle}rad)`;
                    } else { aimLine.style.display = 'none'; }
                }, true);
            }

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupMobileJoystick(containerId, knobId, callback, isShootStick = false) {
            const container = document.getElementById(containerId);
            const knob = document.getElementById(knobId);
            const rect = container.getBoundingClientRect();
            const radius = rect.width / 2;
            let touchId = null;

            container.addEventListener('touchstart', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touchId === null) {
                        touchId = touch.identifier;
                        updateKnob(touch);
                    }
                }
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];
                    if (touch.identifier === touchId) updateKnob(touch);
                }
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === touchId) {
                        touchId = null;
                        knob.style.transform = 'translate(0px, 0px)';
                        if (isShootStick && (Math.abs(joystickShoot.x) > 0.2 || Math.abs(joystickShoot.y) > 0.2)) {
                            if (player && !player.isDead && player.cooldown <= 0) {
                                shootBullet(player, joystickShoot.x, joystickShoot.y, true);
                                player.cooldown = 0.3;
                                player.lastAttackTime = clock.getElapsedTime();
                            }
                        }
                        callback(0, 0, false);
                    }
                }
            }, { passive: false });

            function updateKnob(touch) {
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + radius;
                const centerY = rect.top + radius;
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > radius) {
                    dx = (dx / distance) * radius;
                    dy = (dy / distance) * radius;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                callback(dx / radius, dy / radius, true);
            }
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        function gameLoop() {
            if (!gameActive) return;
            requestAnimationFrame(gameLoop);

            const delta = clock.getDelta();
            const timeNow = clock.getElapsedTime();

            if (poisonZone.radius > 6) {
                poisonZone.radius -= poisonShrinkSpeed * delta;
                poisonVisualMesh.scale.set(poisonZone.radius / (MAP_SIZE / 2), 1, poisonZone.radius / (MAP_SIZE / 2));
            }

            updateEntities(delta, timeNow);
            updateBullets(delta);
            updateParticles(delta);
            updatePowerups(delta);
            updateOverheadHUDPositions();

            if (player && !player.isDead) {
                camera.position.set(player.mesh.position.x, player.mesh.position.y + 13, player.mesh.position.z + 10);
                camera.lookAt(player.mesh.position.x, player.mesh.position.y, player.mesh.position.z);
                
                // Сетевая отправка координат нашего игрока
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: 'game_update',
                        x: player.mesh.position.x,
                        z: player.mesh.position.z,
                        hp: player.hp,
                        rotY: player.mesh.rotation.y,
                        powerups: player.powerups,
                        isDead: player.isDead
                    }));
                }
            }

            renderer.render(scene, camera);
        }

        function updateEntities(delta, timeNow) {
            let aliveCount = 0;

            entities.forEach(ent => {
                if (ent.isDead) return;
                aliveCount++;

                if (ent.cooldown > 0) ent.cooldown -= delta;

                // Автохил (через 5 сек спокойствия)
                if (timeNow - ent.lastHurtTime >= 5.0 && timeNow - ent.lastAttackTime >= 5.0) {
                    ent.hp = Math.min(ent.maxHp, ent.hp + 5 * delta);
                }

                let moveX = 0, moveZ = 0;

                if (!ent.isBot && ent.id === 'player') {
                    // Игрок ПК / Мобильный
                    if (isMobile) {
                        moveX = joystickMove.x;
                        moveZ = joystickMove.y;
                    } else {
                        if (keys.w) moveZ = -1;
                        if (keys.s) moveZ = 1;
                        if (keys.a) moveX = -1;
                        if (keys.d) moveX = 1;
                    }

                    const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                    if (length > 0) {
                        moveX /= length;
                        moveZ /= length;
                        let nextX = ent.mesh.position.x + moveX * ent.speed * delta;
                        let nextZ = ent.mesh.position.z + moveZ * ent.speed * delta;

                        let corrected = checkCollisionAndCorrect(ent, nextX, nextZ);
                        ent.mesh.position.x = corrected.x;
                        ent.mesh.position.z = corrected.z;

                        if (isMobile) {
                            if (!joystickShoot.active && (Math.abs(joystickMove.x) > 0.1 || Math.abs(joystickMove.y) > 0.1)) {
                                rotateTowards(ent, moveX, moveZ, 15 * delta);
                            } else if (joystickShoot.active && (Math.abs(joystickShoot.x) > 0.1 || Math.abs(joystickShoot.y) > 0.1)) {
                                rotateTowards(ent, joystickShoot.x, joystickShoot.y, 25 * delta);
                            }
                        }
                    }

                    if (!isMobile) rotatePlayerToMouse();
                    animateRunning(ent, length > 0);

                    if (!isMobile && mouse.clicked && ent.cooldown <= 0) {
                        const dirX = Math.sin(ent.mesh.rotation.y);
                        const dirZ = Math.cos(ent.mesh.rotation.y);
                        shootBullet(ent, dirX, dirZ, true);
                        ent.cooldown = 0.3;
                        ent.lastAttackTime = timeNow;
                    }

                    hudHp.textContent = `${Math.round(ent.hp)} / ${ent.maxHp}`;
                } 
                else if (ent.isBot) {
                    // ИИ БОТОВ (Дерутся яростно, ломают банки, собирают кристаллы)
                    ent.aiTimer -= delta;

                    const distToCenter = Math.sqrt(ent.mesh.position.x * ent.mesh.position.x + ent.mesh.position.z * ent.mesh.position.z);
                    const isInPoisonDanger = distToCenter > (poisonZone.radius - 8);

                    let visibleEnemies = [];
                    let visibleBoxes = [];
                    let visiblePowerups = [];

                    entities.forEach(other => {
                        if (other.id !== ent.id && !other.isDead) {
                            const d = Math.sqrt((other.mesh.position.x - ent.mesh.position.x)**2 + (other.mesh.position.z - ent.mesh.position.z)**2);
                            if (d < 30) visibleEnemies.push({ entity: other, dist: d });
                        }
                    });

                    boxes.forEach(box => {
                        if (!box.isDead) {
                            const d = Math.sqrt((box.x - ent.mesh.position.x)**2 + (box.z - ent.mesh.position.z)**2);
                            if (d < 30) visibleBoxes.push({ obj: box, dist: d });
                        }
                    });

                    powerups.forEach(pow => {
                        const d = Math.sqrt((pow.mesh.position.x - ent.mesh.position.x)**2 + (pow.mesh.position.z - ent.mesh.position.z)**2);
                        if (d < 30) visiblePowerups.push({ obj: pow, dist: d });
                    });

                    visibleEnemies.sort((a,b) => a.dist - b.dist);
                    visibleBoxes.sort((a,b) => a.dist - b.dist);
                    visiblePowerups.sort((a,b) => a.dist - b.dist);

                    if (ent.aiTimer <= 0) {
                        ent.aiTimer = 0.2 + Math.random() * 0.2;

                        if (isInPoisonDanger) {
                            ent.aiState = 'panic_zone';
                        } else if (visiblePowerups.length > 0) {
                            ent.aiState = 'grab_gem';
                        } else if (visibleEnemies.length > 0) {
                            ent.aiState = 'fight'; 
                        } else if (visibleBoxes.length > 0) {
                            ent.aiState = 'loot_box';
                        } else {
                            ent.aiState = 'wander';
                            if (Math.sqrt((ent.targetX - ent.mesh.position.x)**2 + (ent.targetZ - ent.mesh.position.z)**2) < 2) {
                                const angle = Math.random() * Math.PI * 2;
                                const dist = 12 + Math.random() * 15;
                                ent.targetX = Math.max(-MAP_SIZE/2 + 6, Math.min(MAP_SIZE/2 - 6, ent.mesh.position.x + Math.cos(angle) * dist));
                                ent.targetZ = Math.max(-MAP_SIZE/2 + 6, Math.min(MAP_SIZE/2 - 6, ent.mesh.position.z + Math.sin(angle) * dist));
                            }
                        }
                    }

                    let aiMoveX = 0, aiMoveZ = 0;

                    if (ent.aiState === 'panic_zone') {
                        const len = Math.sqrt(ent.mesh.position.x**2 + ent.mesh.position.z**2);
                        aiMoveX = -ent.mesh.position.x / len;
                        aiMoveZ = -ent.mesh.position.z / len;
                    } 
                    else if (ent.aiState === 'grab_gem' && visiblePowerups.length > 0) {
                        const targetGem = visiblePowerups[0].obj;
                        const dx = targetGem.mesh.position.x - ent.mesh.position.x;
                        const dz = targetGem.mesh.position.z - ent.mesh.position.z;
                        const len = Math.sqrt(dx*dx + dz*dz);
                        if (len > 0.1) { aiMoveX = dx / len; aiMoveZ = dz / len; }
                    } 
                    else if (ent.aiState === 'loot_box' && visibleBoxes.length > 0) {
                        const targetBox = visibleBoxes[0].obj;
                        const dx = targetBox.x - ent.mesh.position.x;
                        const dz = targetBox.z - ent.mesh.position.z;
                        const len = Math.sqrt(dx*dx + dz*dz);
                        if (len > 3.0) { aiMoveX = dx / len; aiMoveZ = dz / len; } 
                        else { aiMoveX = -dz / len; aiMoveZ = dx / len; }
                    } 
                    else if (ent.aiState === 'fight' && visibleEnemies.length > 0) {
                        const target = visibleEnemies[0].entity;
                        const dx = target.mesh.position.x - ent.mesh.position.x;
                        const dz = target.mesh.position.z - ent.mesh.position.z;
                        const len = Math.sqrt(dx*dx + dz*dz);
                        if (len < 4.0) { aiMoveX = -dz / len; aiMoveZ = dx / len; } 
                        else { aiMoveX = dx / len; aiMoveZ = dz / len; }
                    } 
                    else {
                        const dx = ent.targetX - ent.mesh.position.x;
                        const dz = ent.targetZ - ent.mesh.position.z;
                        const len = Math.sqrt(dx*dx + dz*dz);
                        if (len > 1.2) { aiMoveX = dx / len; aiMoveZ = dz / len; }
                    }

                    const aiLen = Math.sqrt(aiMoveX * aiMoveX + aiMoveZ * aiMoveZ);
                    if (aiLen > 0) {
                        aiMoveX /= aiLen; aiMoveZ /= aiLen;
                        let nextBotX = ent.mesh.position.x + aiMoveX * ent.speed * delta;
                        let nextBotZ = ent.mesh.position.z + aiMoveZ * ent.speed * delta;

                        let corrected = checkCollisionAndCorrect(ent, nextBotX, nextBotZ);
                        ent.mesh.position.x = corrected.x;
                        ent.mesh.position.z = corrected.z;

                        rotateTowards(ent, aiMoveX, aiMoveZ, 15 * delta);
                        animateRunning(ent, true);
                    } else {
                        animateRunning(ent, false);
                    }

                    // Стрельба ботов
                    if (ent.cooldown <= 0 && ent.aiState !== 'panic_zone') {
                        if (ent.aiState === 'fight' && visibleEnemies.length > 0) {
                            const enemy = visibleEnemies[0].entity;
                            const sX = enemy.mesh.position.x - ent.mesh.position.x;
                            const sZ = enemy.mesh.position.z - ent.mesh.position.z;
                            const sLen = Math.sqrt(sX*sX + sZ*sZ);
                            
                            rotateTowards(ent, sX/sLen, sZ/sLen, 35 * delta);
                            shootBullet(ent, sX/sLen, sZ/sLen, false);
                            ent.cooldown = 0.3 + Math.random() * 0.2;
                            ent.lastAttackTime = timeNow;
                        } else if (ent.aiState === 'loot_box' && visibleBoxes.length > 0) {
                            const box = visibleBoxes[0].obj;
                            const sX = box.x - ent.mesh.position.x;
                            const sZ = box.z - ent.mesh.position.z;
                            const sLen = Math.sqrt(sX*sX + sZ*sZ);
                            
                            rotateTowards(ent, sX/sLen, sZ/sLen, 35 * delta);
                            shootBullet(ent, sX/sLen, sZ/sLen, false);
                            ent.cooldown = 0.4;
                            ent.lastAttackTime = timeNow;
                        }
                    }
                }

                // В зоне яда
                const distToC = Math.sqrt(ent.mesh.position.x**2 + ent.mesh.position.z**2);
                if (distToC > poisonZone.radius) {
                    ent.hp -= 35 * delta; 
                    ent.lastHurtTime = timeNow;

                    if (ent.id === 'player') dangerWarning.style.display = 'block';
                    if (ent.hp <= 0) killEntity(ent);
                } else if (ent.id === 'player') {
                    dangerWarning.style.display = 'none';
                }
            });

            hudAlive.textContent = aliveCount;
            checkGameRules(aliveCount);
        }

        function rotateTowards(ent, dirX, dirZ, step) {
            const targetRotation = Math.atan2(dirX, dirZ);
            let diff = targetRotation - ent.mesh.rotation.y;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            ent.mesh.rotation.y += Math.max(-step, Math.min(step, diff));
        }

        function rotatePlayerToMouse() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const targetPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(plane, targetPoint)) {
                const dx = targetPoint.x - player.mesh.position.x;
                const dz = targetPoint.z - player.mesh.position.z;
                rotateTowards(player, dx, dz, 0.25);
            }
        }

        function animateRunning(ent, isMoving) {
            const time = clock.getElapsedTime();
            const leftLeg = ent.mesh.getObjectByName("leftLeg");
            const rightLeg = ent.mesh.getObjectByName("rightLeg");
            const leftArm = ent.mesh.getObjectByName("leftArm");
            const rightArm = ent.mesh.getObjectByName("rightArm");

            if (leftLeg && rightLeg) {
                if (isMoving) {
                    leftLeg.rotation.x = Math.sin(time * 15) * 0.6;
                    rightLeg.rotation.x = -Math.sin(time * 15) * 0.6;
                    if (leftArm && rightArm) {
                        leftArm.rotation.x = -Math.sin(time * 15) * 0.3;
                        rightArm.rotation.x = Math.sin(time * 15) * 0.15;
                    }
                } else {
                    leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                    if (leftArm && rightArm) { leftArm.rotation.x = 0; rightArm.rotation.x = 0; }
                }
            }
        }

        function shootBullet(owner, dirX, dirZ, isOurShot) {
            const bulletGeo = new THREE.BoxGeometry(0.24, 0.24, 0.24);
            const bulletMat = new THREE.MeshBasicMaterial({ color: owner.id === 'player' ? 0xffea00 : 0xff4500 });
            const bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);
            
            bulletMesh.position.set(owner.mesh.position.x + dirX * 0.6, 0.6, owner.mesh.position.z + dirZ * 0.6);
            scene.add(bulletMesh);

            playDistanceSound(owner.mesh.position.x, owner.mesh.position.z, "shoot");

            const rArm = owner.mesh.getObjectByName("rightArm");
            if (rArm) {
                rArm.position.z = -0.15;
                setTimeout(() => { rArm.position.z = 0; }, 70);
            }

            const powerMultiplier = 1.0 + (owner.powerups * 0.12);
            const damage = BASE_DAMAGE * powerMultiplier;

            bullets.push({
                mesh: bulletMesh,
                dirX: dirX,
                dirZ: dirZ,
                speed: 21.0, 
                ownerId: owner.id,
                damage: damage,
                life: 1.4
            });

            // Сетевая отправка выстрела
            if (isOurShot && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'shoot',
                    dirX: dirX,
                    dirZ: dirZ
                }));
            }
        }

        function updateBullets(delta) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.life -= delta;

                b.mesh.position.x += b.dirX * b.speed * delta;
                b.mesh.position.z += b.dirZ * b.speed * delta;

                let hit = false;

                for (let k = obstacles.length - 1; k >= 0; k--) {
                    const obs = obstacles[k];
                    const minX = obs.x - obs.w / 2;
                    const maxX = obs.x + obs.w / 2;
                    const minZ = obs.z - obs.d / 2;
                    const maxZ = obs.z + obs.d / 2;

                    if (b.mesh.position.x >= minX && b.mesh.position.x <= maxX &&
                        b.mesh.position.z >= minZ && b.mesh.position.z <= maxZ) {
                        
                        hit = true;

                        if (obs.type === 'box') {
                            const boxIndex = boxes.findIndex(box => box.id === obs.id);
                            if (boxIndex !== -1) {
                                const targetBox = boxes[boxIndex];
                                targetBox.hp -= b.damage;

                                createExplosion(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z, 0x8b5a2b, 8);

                                if (targetBox.hp <= 0) {
                                    targetBox.isDead = true;
                                    scene.remove(targetBox.mesh);
                                    playDistanceSound(targetBox.x, targetBox.z, "box_break");
                                    spawnPowerup(targetBox.x, targetBox.z);

                                    obstacles.splice(k, 1);
                                    boxes.splice(boxIndex, 1);
                                }
                            }
                        } else {
                            createExplosion(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z, 0x555555, 4);
                        }
                        break;
                    }
                }

                if (!hit) {
                    for (let j = 0; j < entities.length; j++) {
                        const ent = entities[j];
                        if (ent.isDead || ent.id === b.ownerId) continue;

                        const dx = b.mesh.position.x - ent.mesh.position.x;
                        const dz = b.mesh.position.z - ent.mesh.position.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);

                        if (dist < 0.75) {
                            ent.hp -= b.damage;
                            ent.lastHurtTime = clock.getElapsedTime(); 
                            
                            playDistanceSound(ent.mesh.position.x, ent.mesh.position.z, "hit");
                            createExplosion(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z, 0xff2222, 10);
                            hit = true;

                            if (ent.hp <= 0) killEntity(ent);
                            break;
                        }
                    }
                }

                if (hit || b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

        function spawnPowerup(x, z) {
            const mesh = createPowerupMesh();
            mesh.position.set(x, 0.4, z);
            scene.add(mesh);
            powerups.push({ mesh: mesh, x: x, z: z });
        }

        function updatePowerups(delta) {
            const time = clock.getElapsedTime();

            for (let i = powerups.length - 1; i >= 0; i--) {
                const pow = powerups[i];
                pow.mesh.rotation.y += 2.5 * delta;
                pow.mesh.position.y = 0.45 + Math.sin(time * 5) * 0.12;

                for (let j = 0; j < entities.length; j++) {
                    const ent = entities[j];
                    if (ent.isDead) continue;

                    const dist = Math.sqrt((ent.mesh.position.x - pow.x)**2 + (ent.mesh.position.z - pow.z)**2);
                    if (dist < 0.95) {
                        ent.powerups++;
                        ent.maxHp += 40;  
                        ent.hp = Math.min(ent.maxHp, ent.hp + 60); 

                        playDistanceSound(ent.mesh.position.x, ent.mesh.position.z, "powerup");
                        createExplosion(pow.x, 0.5, pow.z, 0x00ffcc, 15);

                        scene.remove(pow.mesh);
                        powerups.splice(i, 1);
                        break;
                    }
                }
            }
        }

        function killEntity(ent) {
            if (ent.isDead) return;
            ent.isDead = true;
            createExplosion(ent.mesh.position.x, 0.5, ent.mesh.position.z, 0xff7700, 30);
            scene.remove(ent.mesh);
            
            const dropCount = Math.max(1, ent.powerups);
            for (let i = 0; i < dropCount; i++) {
                const angle = (i / dropCount) * Math.PI * 2;
                const dist = 1.0 + Math.random() * 0.5;
                spawnPowerup(ent.mesh.position.x + Math.cos(angle)*dist, ent.mesh.position.z + Math.sin(angle)*dist);
            }

            if (ent.overheadElement.container.parentNode) {
                ent.overheadElement.container.parentNode.removeChild(ent.overheadElement.container);
            }
        }

        function createExplosion(x, y, z, color, count = 8) {
            for (let i = 0; i < count; i++) {
                const geo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                scene.add(mesh);

                particles.push({
                    mesh: mesh,
                    vX: (Math.random() - 0.5) * 7,
                    vY: Math.random() * 7,
                    vZ: (Math.random() - 0.5) * 7,
                    life: 0.6
                });
            }
        }

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= delta;
                p.mesh.position.x += p.vX * delta;
                p.mesh.position.y += p.vY * delta;
                p.mesh.position.z += p.vZ * delta;
                p.vY -= 9.81 * delta;

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        function checkGameRules(aliveCount) {
            if (player.isDead) {
                endGame(false, aliveCount + 1);
                return;
            }
            if (aliveCount === 1 && !player.isDead) {
                endGame(true, 1);
            }
        }

        function endGame(isVictory, rank) {
            gameActive = false;
            gameScreen.style.display = 'none';
            gameOverScreen.style.display = 'flex';

            const title = document.getElementById('go-result-title');
            const rankSpan = document.getElementById('go-rank');
            const trophiesSpan = document.getElementById('go-trophies');

            rankSpan.textContent = `#${rank}`;
            isVictoryEnd = isVictory;

            let diffTrophies = 0;
            if (rank === 1) {
                title.textContent = "ПОБЕДА! 🏆";
                title.style.color = "#ffde00";
                diffTrophies = 10;
                trophiesSpan.textContent = `+10 Кубков`;
                trophiesSpan.style.color = "#00ff2b";
                totalWins++;
            } else if (rank === 2) {
                title.textContent = "ПОЧТИ ПОБЕДА!";
                title.style.color = "#00e5ff";
                diffTrophies = 6;
                trophiesSpan.textContent = `+6 Кубков`;
                trophiesSpan.style.color = "#00ff2b";
                totalWins++;
            } else {
                title.textContent = "ВЫ ПОВЕРЖЕНЫ!";
                title.style.color = "#ff3333";
                const penalty = Math.min(6, rank - 3);
                diffTrophies = -penalty;
                trophiesSpan.textContent = `-${penalty} Кубков`;
                trophiesSpan.style.color = "#ff3333";
                totalLosses++;
            }

            trophies = Math.max(0, trophies + diffTrophies);
            saveGameData();

            menuTrophiesCount.textContent = trophies;
            document.getElementById('stat-wins').textContent = totalWins;
            document.getElementById('stat-losses').textContent = totalLosses;

            initEndGameScene(isVictory);
        }

        function initEndGameScene(isVictory) {
            const container = document.getElementById('end-game-char-view');
            container.innerHTML = '';

            const width = container.clientWidth || 320;
            const height = container.clientHeight || 420;

            endScene = new THREE.Scene();
            endCamera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            endCamera.position.set(0, 1.2, 3);
            endCamera.lookAt(0, 0.8, 0);

            endRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            endRenderer.setSize(width, height);
            endRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(endRenderer.domElement);

            const light = new THREE.AmbientLight(0xffffff, 0.85);
            endScene.add(light);

            endCharacter = createCharacterModel(0x00ff2b);
            endScene.add(endCharacter);

            animateEndGameCharacter();
        }

        function animateEndGameCharacter() {
            if (gameActive) return;
            requestAnimationFrame(animateEndGameCharacter);
            const time = clock.getElapsedTime();

            if (endCharacter) {
                if (isVictoryEnd) {
                    endCharacter.position.y = Math.abs(Math.sin(time * 6)) * 0.55;
                    endCharacter.rotation.y = time * 3.5;
                } else {
                    endCharacter.rotation.z = Math.sin(time * 2.2) * 0.08;
                }
            }
            if (endRenderer) endRenderer.render(endScene, endCamera);
        }

        function backToMenu() {
            gameActive = false;
            menuScreen.style.display = 'flex';
            gameScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            if (endRenderer) {
                endRenderer.dispose();
                const canvas = endRenderer.domElement;
                if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
            }
            if (renderer) {
                renderer.dispose();
                const canvas = renderer.domElement;
                if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
            }
            entities = [];
            bullets = [];
            particles = [];
            obstacles = [];
            boxes = [];
            powerups = [];
            clock = new THREE.Clock();
            initMenu3D();
        }

        btnBackToMenu.addEventListener('click', backToMenu);
    </script>
</body>
